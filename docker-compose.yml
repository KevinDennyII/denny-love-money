services:
  db:
    image: postgres:16
    container_name: denny-love-money-db
    ports:
      # Host 5435 — 5433 is often used by other local Docker Postgres containers
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denny_love_money
    volumes:
      - denny_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d denny_love_money"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  denny_pg_data:
